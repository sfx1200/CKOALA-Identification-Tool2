stages:
  - build
  - test

compilation:
  stage: build
  script:
    - echo "Création du dossier de sortie..."
    - mkdir -p out
    - echo "Compilation des sources et des tests..."
    - javac -cp lib/junit-platform-console-standalone.jar -d out/ src/*.java tests/*.java
  artifacts:
    paths:
      - out/

execution_tests:
  stage: test
  dependencies:
    - compilation
  script:
    - echo "Lancement de JUnit Platform..."
    - java -jar lib/junit-platform-console-standalone.jar --class-path out/ --scan-classpath